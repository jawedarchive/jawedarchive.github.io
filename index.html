<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jawed Archive</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      line-height: 1.6;
    }

    header {
      background: #1d1d1d;
      padding: 40px 20px;
      text-align: center;
      border-bottom: 2px solid #333;
    }

    header h1 {
      margin: 0;
      font-size: 3rem;
    }

    header p {
      color: #aaa;
      margin-top: 10px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
    }

    .video-card {
      background: #1a1a1a;
      border: 1px solid #333;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    .video-card h2 {
      margin-top: 0;
      color: #fff;
    }

    .video-card a {
      color: #4da3ff;
      text-decoration: none;
    }

    .video-card a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      border-top: 1px solid #333;
      margin-top: 40px;
    }

    .tag {
      display: inline-block;
      background: #333;
      color: #ccc;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Jawed Archive</h1>
    <p>Preserving Jawed since 2026.</p>
  </header>

  <main>


    <section class="video-card">
      <h2>Archive Notes</h2>
      <p>
        This site exists to preserve copies, screenshots, metadata,
        transcripts, and historical context surrounding Jawed's
        videos and channel activity.
      </p>
    </section>

  </main>

  <footer>
    <p>Jawed Archive © 2026</p>
  </footer>

</body>
</html>
